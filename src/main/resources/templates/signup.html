<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>新規ユーザー登録 - スマート冷蔵庫管理</title>
	<link rel="stylesheet" th:href="@{/css/style.css}">
	<link rel="apple-touch-icon" href="/images/icon.png?v=1">
	<link rel="icon" type="image/png" href="/images/icon.png?v=1">
</head>

<body>
	<div class="container">
		<div class="form-card">
			<h1>新規ユーザー登録</h1>
			<div th:if="${errorMessage}" class="alert-danger">
				<span th:text="${errorMessage}"></span>
			</div>
			<form th:action="@{/signup}" method="post">
				<div class="form-group">
					<label>ユーザー名</label>
					<input type="text" name="username" required placeholder="新しいユーザー名">
				</div>
				<div class="form-group">
					<label>パスワード</label>
					<input type="password" name="password" required placeholder="新しいパスワード">
				</div>
				<button type="submit" class="full-width-btn">アカウントを作成する</button>
			</form>

			<div class="link-area">
				<p>すでにアカウントをお持ちですか？</p>
				<a th:href="@{/login}" class="secondary-btn">ログイン画面に戻る</a>
			</div>
		</div>
	</div>
</body>

</html>
